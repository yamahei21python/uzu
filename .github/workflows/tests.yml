name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt huggingface_hub
      - name: Fetch dedup corpora (gitignored, needed by kit tests)
        run: |
          hf download yamahei21/uzu-quant-kit --repo-type dataset --local-dir /tmp/kit
          mkdir -p experiments/qwen35-0.8b/data
          cp /tmp/kit/data/*.txt experiments/qwen35-0.8b/data/
      - name: Run model-free tests
        run: python -m pytest -q tests/
